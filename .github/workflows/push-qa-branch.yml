name: Deploy to QA Org

on:
  push:
    branches: [ qa-branch ]
    paths:
      - 'force-app/**'

jobs:
  deploy-to-qa:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}

    steps:
      # Install Salesforce CLI
      - name: Install Salesforce CLI
        run: |
          wget https://developer.salesforce.com/media/salesforce-cli/sfdx/channels/stable/sfdx-linux-x64.tar.xz
          mkdir ~/sfdx
          tar xJf sfdx-linux-x64.tar.xz -C ~/sfdx --strip-components 1
          echo "$HOME/sfdx/bin" >> $GITHUB_PATH
          ~/sfdx/bin/sfdx version

      # Install SFDX Git Delta
      - name: Installing sfdx git delta
        run: |
          echo y | sfdx plugins:install sfdx-git-delta
          sfdx plugins

      # Checkout code
      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Create auth file from GitHub Secret
      - name: Populate auth file with SFDX URL
        run: |
          echo "${{ secrets.SFDX_INTEGRATION_URL }}" > ./SFDX_INTEGRATION_URL.txt

      # Generate delta (somente mudanças)
      - name: Create delta packages
        run: |
          mkdir changed-sources
          sfdx sgd:source:delta --to "HEAD" --from "HEAD^" --output changed-sources/ --generate-delta --source force-app/

      # Authenticate to QA org
      - name: Authenticate to QA Org
        run: sfdx auth:sfdxurl:store -f ./SFDX_INTEGRATION_URL.txt -s -a qa

      # Deploy para QA
      - name: Deploy to QA org
        run: sfdx force:source:deploy -p force-app --testlevel RunLocalTests --json

      # Deploy destructive changes (se houver)
      - name: Deploy destructive changes
        run: |
          if [ -d "changed-sources/destructiveChanges" ]; then
            sfdx force:mdapi:deploy -d changed-sources/destructiveChanges --ignorewarnings
          fi
